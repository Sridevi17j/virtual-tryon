[build]
  publish = "out"
  command = "npm run build"

[build.environment]
  NEXT_TELEMETRY_DISABLED = "1"

# Original Heroku redirect (commented out)
# [[redirects]]
#   from = "/api/*"
#   to = "https://your-backend-api.herokuapp.com/api/:splat"
#   status = 200
#   force = true

# Updated Railway backend redirects
[[redirects]]
  from = "/api/*"
  to = "https://backend-api-production-8f2f.up.railway.app/api/:splat"
  status = 200
  force = true

# Health endpoint redirect (health is at root, not /api/v1)
[[redirects]]
  from = "/health"
  to = "https://backend-api-production-8f2f.up.railway.app/health"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Original restrictive CSP (commented out)
    # Content-Security-Policy = "default-src 'self'; img-src 'self' data: https:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'"
    
    # Completely remove CSP to test
    # Content-Security-Policy = "default-src 'self' https: data:; connect-src 'self' https: wss: ws:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: https:; font-src 'self' https:"