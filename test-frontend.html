<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Try-On Fashion App - React Version</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/react-router-dom@6.14.0/index.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .text-gradient {
            background: linear-gradient(to right, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-radius: 50%;
            border-top: 3px solid #3498db;
            animation: spin 2s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .animate-slide-up {
            animation: slideUp 0.3s ease-out;
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body class="bg-gray-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, createContext, useContext, useCallback } = React;
        const { BrowserRouter: Router, Routes, Route, Link, useLocation, useNavigate, useParams } = ReactRouterDOM;

        // Toast Context
        const ToastContext = createContext();

        const ToastProvider = ({ children }) => {
            const [toasts, setToasts] = useState([]);

            const addToast = useCallback((toast) => {
                const id = Date.now().toString();
                const newToast = { ...toast, id };
                
                setToasts(prev => [...prev, newToast]);

                setTimeout(() => {
                    setToasts(prev => prev.filter(t => t.id !== id));
                }, toast.duration || 5000);
            }, []);

            const removeToast = useCallback((id) => {
                setToasts(prev => prev.filter(toast => toast.id !== id));
            }, []);

            const getToastStyles = (type) => {
                switch (type) {
                    case 'success': return 'bg-green-50 border-green-200 text-green-800';
                    case 'error': return 'bg-red-50 border-red-200 text-red-800';
                    case 'warning': return 'bg-yellow-50 border-yellow-200 text-yellow-800';
                    default: return 'bg-blue-50 border-blue-200 text-blue-800';
                }
            };

            const getToastIcon = (type) => {
                switch (type) {
                    case 'success': return '✓';
                    case 'error': return '✕';
                    case 'warning': return '⚠';
                    default: return 'ℹ';
                }
            };

            return React.createElement(ToastContext.Provider, { value: { toasts, addToast, removeToast } },
                children,
                React.createElement('div', { className: 'fixed top-4 right-4 z-50 space-y-2' },
                    toasts.map(toast =>
                        React.createElement('div', {
                            key: toast.id,
                            className: `max-w-sm p-4 rounded-lg border shadow-lg transition-all duration-300 animate-slide-up ${getToastStyles(toast.type)}`
                        },
                            React.createElement('div', { className: 'flex items-start' },
                                React.createElement('span', { className: 'flex-shrink-0 mr-2 text-lg' }, getToastIcon(toast.type)),
                                React.createElement('p', { className: 'flex-1 text-sm font-medium' }, toast.message),
                                React.createElement('button', {
                                    onClick: () => removeToast(toast.id),
                                    className: 'flex-shrink-0 ml-2 text-gray-400 hover:text-gray-600 transition-colors'
                                }, '×')
                            )
                        )
                    )
                )
            );
        };

        const useToast = () => {
            const context = useContext(ToastContext);
            if (!context) {
                throw new Error('useToast must be used within a ToastProvider');
            }
            return context;
        };

        // Header Component
        const Header = () => {
            const location = useLocation();

            const navigation = [
                { name: 'Home', href: '/' },
                { name: 'Try On', href: '/try-on' },
                { name: 'About', href: '/about' },
            ];

            return React.createElement('header', { className: 'bg-white shadow-sm border-b border-gray-200' },
                React.createElement('div', { className: 'max-w-7xl mx-auto px-4 sm:px-6 lg:px-8' },

        // HomePage Component

            return React.createElement('div', { className: 'min-h-screen' },

                        React.createElement('div', { className: 'text-center' },
                            React.createElement('h1', { className: 'text-5xl md:text-6xl font-bold text-gray-900 mb-6' },
                                'Try On Clothes',
                                React.createElement('span', { className: 'block text-gradient' }, 'Virtually')

                            React.createElement('p', { className: 'text-xl text-gray-600 mb-8 max-w-3xl mx-auto' },

                                        React.createElement('path', { strokeLinecap: 'round', strokeLinejoin: 'round', strokeWidth: 2, d: 'M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12' })
                                    )
                                ),
                                React.createElement('h3', { className: 'text-xl font-semibold text-gray-900 mb-3' }, 'Upload Your Photo'),
                                React.createElement('p', { className: 'text-gray-600' }, 'Upload a clear, full-body photo of yourself in good lighting')
                            ),
                            // Step 2
                            React.createElement('div', { className: 'text-center' },
                                React.createElement('div', { className: 'w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6' },
                                    React.createElement('svg', { className: 'w-8 h-8 text-green-600', fill: 'none', stroke: 'currentColor', viewBox: '0 0 24 24' },
                                        React.createElement('path', { strokeLinecap: 'round', strokeLinejoin: 'round', strokeWidth: 2, d: 'M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z' })

                                    React.createElement('svg', { className: 'w-8 h-8 text-purple-600', fill: 'none', stroke: 'currentColor', viewBox: '0 0 24 24' },
                                        React.createElement('path', { strokeLinecap: 'round', strokeLinejoin: 'round', strokeWidth: 2, d: 'M13 10V3L4 14h7v7l9-11h-7z' })

                                React.createElement('h3', { className: 'text-xl font-semibold text-gray-900 mb-3' }, 'See the Magic'),
                                React.createElement('p', { className: 'text-gray-600' }, 'Our AI processes your images and shows you how the clothes look on you')
                            )
                        )
                    )
                ),
                // About section
                React.createElement('section', { id: 'about', className: 'py-20 bg-gray-50' },
                    React.createElement('div', { className: 'max-w-4xl mx-auto px-4 text-center' },
                        React.createElement('h2', { className: 'text-3xl font-bold text-gray-900 mb-6' }, 'About Virtual Try-On'),
                        React.createElement('p', { className: 'text-lg text-gray-600 mb-8' }, 
                            'Revolutionary AI-powered fashion technology using VITON-HD for realistic clothing fitting simulation.'
                        ),
                        React.createElement('div', { className: 'bg-blue-50 rounded-lg p-6 border border-blue-200' },
                            React.createElement('div', { className: 'flex items-start justify-center' },
                                React.createElement('div', null,
                                    React.createElement('h4', { className: 'text-lg font-semibold text-blue-900 mb-2' }, 'React Version'),
                                    React.createElement('p', { className: 'text-blue-800' },
                                        'This is the React version of the Virtual Try-On app with full routing, state management, and component architecture. Same beautiful UI as demo.html but with React power!'
                                    )
                                )
                            )
                        )
                    )
                )
            );
        };

        // TryOnPage Component
        const TryOnPage = () => {
            const { addToast } = useToast();
            const [isProcessing, setIsProcessing] = useState(false);
            const [personImage, setPersonImage] = useState(null);
            const [garmentImage, setGarmentImage] = useState(null);
            const [personPreview, setPersonPreview] = useState(null);
            const [garmentPreview, setGarmentPreview] = useState(null);
            const [showResult, setShowResult] = useState(false);

            const handlePersonImageChange = (event) => {
                const file = event.target.files?.[0];
                if (file) {
                    setPersonImage(file);
                    const reader = new FileReader();
                    reader.onload = (e) => setPersonPreview(e.target.result);
                    reader.readAsDataURL(file);
                }
            };

            const handleGarmentImageChange = (event) => {
                const file = event.target.files?.[0];
                if (file) {
                    setGarmentImage(file);
                    const reader = new FileReader();
                    reader.onload = (e) => setGarmentPreview(e.target.result);
                    reader.readAsDataURL(file);
                }
            };

            const handleSubmit = async (event) => {
                event.preventDefault();
                
                if (!personImage || !garmentImage) {
                    addToast({
                        type: 'error',
                        message: 'Please upload both person and garment images'
                    });
                    return;
                }

                setIsProcessing(true);

                try {
                    await new Promise(resolve => setTimeout(resolve, 2000));
                    
                    addToast({
                        type: 'success',
                        message: 'Processing completed! Your virtual try-on result is ready.'
                    });

                    setShowResult(true);
                    
                    setTimeout(() => {
                        document.getElementById('result')?.scrollIntoView({ behavior: 'smooth' });
                    }, 100);

                } catch (error) {
                    addToast({
                        type: 'error',
                        message: 'Failed to process try-on. Please try again.'
                    });
                } finally {
                    setIsProcessing(false);
                }
            };

            const resetDemo = () => {
                setPersonImage(null);
                setGarmentImage(null);
                setPersonPreview(null);
                setGarmentPreview(null);
                setShowResult(false);
                setIsProcessing(false);
                
                document.getElementById('personImage').value = '';
                document.getElementById('garmentImage').value = '';
            };

            const canSubmit = personImage && garmentImage && !isProcessing;

            return React.createElement('div', { className: 'min-h-screen bg-gray-50 py-8' },
                React.createElement('div', { className: 'max-w-4xl mx-auto px-4 sm:px-6 lg:px-8' },
                    React.createElement('div', { className: 'text-center mb-12' },
                        React.createElement('h1', { className: 'text-3xl md:text-4xl font-bold text-gray-900 mb-4' }, 'Virtual Try-On Demo'),
                        React.createElement('p', { className: 'text-lg text-gray-600' }, 'Upload your photo and a garment to see how it looks on you')
                    ),
                    React.createElement('form', { onSubmit: handleSubmit, className: 'space-y-8' },
                        // Upload sections
                        React.createElement('div', { className: 'grid grid-cols-1 md:grid-cols-2 gap-8' },
                            // Person Image Upload
                            React.createElement('div', { className: 'bg-white rounded-lg shadow-sm border border-gray-200 p-6' },
                                React.createElement('h3', { className: 'text-lg font-semibold text-gray-900 mb-4' }, 'Your Photo'),
                                React.createElement('div', { className: 'border-2 border-dashed border-gray-300 rounded-lg p-8 text-center' },
                                    React.createElement('input', {
                                        id: 'personImage',
                                        type: 'file',
                                        accept: 'image/*',
                                        onChange: handlePersonImageChange,
                                        className: 'hidden',
                                        disabled: isProcessing
                                    }),
                                    React.createElement('label', { htmlFor: 'personImage', className: 'cursor-pointer' },
                                        personPreview ? 
                                            React.createElement('div', { className: 'space-y-4' },
                                                React.createElement('img', {
                                                    src: personPreview,
                                                    alt: 'Person preview',
                                                    className: 'max-w-full h-48 object-cover rounded mx-auto'
                                                }),
                                                React.createElement('p', { className: 'text-sm text-gray-500' }, 'Click to change image')
                                            ) :
                                            React.createElement('div', null,
                                                React.createElement('svg', { className: 'w-12 h-12 text-gray-400 mx-auto mb-4', fill: 'none', stroke: 'currentColor', viewBox: '0 0 24 24' },
                                                    React.createElement('path', { strokeLinecap: 'round', strokeLinejoin: 'round', strokeWidth: 2, d: 'M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12' })
                                                ),
                                                React.createElement('p', { className: 'text-gray-600' }, 'Click to upload your photo'),
                                                React.createElement('p', { className: 'text-sm text-gray-400' }, 'PNG, JPG, GIF up to 10MB')
                                            )
                                    )
                                )
                            ),
                            // Garment Image Upload
                            React.createElement('div', { className: 'bg-white rounded-lg shadow-sm border border-gray-200 p-6' },
                                React.createElement('h3', { className: 'text-lg font-semibold text-gray-900 mb-4' }, 'Garment'),
                                React.createElement('div', { className: 'border-2 border-dashed border-gray-300 rounded-lg p-8 text-center' },
                                    React.createElement('input', {
                                        id: 'garmentImage',
                                        type: 'file',
                                        accept: 'image/*',
                                        onChange: handleGarmentImageChange,
                                        className: 'hidden',
                                        disabled: isProcessing
                                    }),
                                    React.createElement('label', { htmlFor: 'garmentImage', className: 'cursor-pointer' },
                                        garmentPreview ? 
                                            React.createElement('div', { className: 'space-y-4' },
                                                React.createElement('img', {
                                                    src: garmentPreview,
                                                    alt: 'Garment preview',
                                                    className: 'max-w-full h-48 object-cover rounded mx-auto'
                                                }),
                                                React.createElement('p', { className: 'text-sm text-gray-500' }, 'Click to change image')
                                            ) :

                                                ),
                                                React.createElement('p', { className: 'text-gray-600' }, 'Click to upload garment'),
                                                React.createElement('p', { className: 'text-sm text-gray-400' }, 'PNG, JPG, GIF up to 10MB')

                                        : 'bg-gray-400 text-white cursor-not-allowed'
                                }`
                            },
                                isProcessing ? 
                                    React.createElement('span', { className: 'flex items-center justify-center' },
                                        React.createElement('div', { className: 'loading-spinner mr-2' }),
                                        'Processing...'
                                    ) :
                                    canSubmit ? 'Start Virtual Try-On' : 'Upload Both Images First'
                            )
                        ),
                        // Results
                        showResult && React.createElement('div', { 
                            id: 'result', 
                            className: 'bg-white rounded-lg shadow-sm border border-gray-200 p-8 text-center' 
                        },
                            React.createElement('h3', { className: 'text-2xl font-semibold text-gray-900 mb-4' }, 'Try-On Result'),

        // Results Page Component
        const ResultsPage = () => {
            const { jobId } = useParams();
            return React.createElement('div', { className: 'min-h-screen bg-gray-50 py-8' },
